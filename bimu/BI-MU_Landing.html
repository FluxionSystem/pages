document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

);\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0fe2f077-a19e-49a7-8520-6698fc10dea6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2a676833-37a4-4a76-83ca-5c7538cadcce\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"335f31e1-31f6-4a9b-9ab9-5d541772affb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   COLORS — \"The Spectrum\"\n   Seven carefully chosen colours. Each carries meaning.\n   None is decorative. (FluxionSystem Brand Book §03)\n   ============================================================ */\n\n:root {\n  /* ---- Base spectrum (immutable brand hexes) ---- */\n  --fx-surface: #060E1A;   /* Primary dark  — page / slide / hero bg     */\n  --fx-navy:    #0B1F3A;   /* Secondary dark — cards, headers, footers   */\n  --fx-blue:    #2E86C1;   /* Accent · Data — charts, hardware, links    */\n  --fx-teal:    #17A589;   /* Accent · Primary — CTAs, active, key data  */\n  --fx-purple:  #7F77DD;   /* Accent · Semantic — uncertainty bands      */\n  --fx-amber:   #E67E22;   /* Accent · Warning — alerts, anomalies       */\n  --fx-light:   #F5F4F0;   /* Light bg — page / slide / paper            */\n  --fx-white:   #FFFFFF;\n  --fx-ink:     #14233B;   /* Body text on light surfaces                */\n\n  /* ---- Interaction shades (derived) ---- */\n  --fx-teal-hover:  #138A72;\n  --fx-teal-active: #0F7460;\n  --fx-teal-soft:   rgba(23,165,137,0.14);\n  --fx-blue-hover:  #2872A6;\n  --fx-blue-soft:   rgba(46,134,193,0.14);\n  --fx-amber-soft:  rgba(230,126,34,0.16);\n  --fx-purple-soft: rgba(127,119,221,0.20); /* uncertainty / confidence fill */\n\n  /* ---- Surface ramp on dark ---- */\n  --fx-navy-1: #0B1F3A;\n  --fx-navy-2: #0E2747;   /* elevated card / hover on dark               */\n  --fx-navy-3: #123056;   /* pressed / selected on dark                  */\n\n  /* ---- Neutral lines on light ---- */\n  --fx-divider-light: #E8E8E4;\n  --fx-divider-dark:  rgba(245,244,240,0.12);\n\n  /* ============================================================\n     SEMANTIC ALIASES — default theme is DARK (the brand default:\n     Surface bg for covers, closers and data-heavy content).\n     ============================================================ */\n  --bg-page:        var(--fx-surface);\n  --bg-card:        var(--fx-navy-1);\n  --bg-elevated:    var(--fx-navy-2);\n  --bg-pressed:     var(--fx-navy-3);\n  --bg-inset:       #04090F;\n\n  --text-primary:   var(--fx-light);\n  --text-secondary: rgba(245,244,240,0.66);\n  --text-muted:     rgba(245,244,240,0.42);\n  --text-inverse:   var(--fx-navy);\n  --text-accent:    var(--fx-teal);\n  --text-link:      var(--fx-blue);\n\n  --border-subtle:  rgba(245,244,240,0.10);\n  --border-default: rgba(245,244,240,0.18);\n  --border-strong:  rgba(245,244,240,0.32);\n  --divider:        var(--fx-divider-dark);\n\n  --accent:         var(--fx-teal);\n  --accent-hover:   var(--fx-teal-hover);\n  --accent-active:  var(--fx-teal-active);\n  --accent-contrast:var(--fx-white);\n  --warning:        var(--fx-amber);\n  --uncertainty:    var(--fx-purple);\n\n  /* Data-viz series (per Brand Book §05 charts) */\n  --data-1: var(--fx-teal);    /* primary series   */\n  --data-2: var(--fx-blue);    /* secondary series */\n  --data-3: var(--fx-purple);  /* uncertainty      */\n  --data-4: var(--fx-amber);   /* threshold / alert */\n  --grid-line: var(--fx-divider-dark);\n\n  --focus-ring: var(--fx-teal);\n}\n\n/* ============================================================\n   LIGHT THEME — apply .theme-light (or [data-theme=\"light\"]).\n   Used for two-column, comparison, table and data-light layouts.\n   ============================================================ */\n.theme-light,\n[data-theme=\"light\"] {\n  --bg-page:        var(--fx-light);\n  --bg-card:        var(--fx-white);\n  --bg-elevated:    var(--fx-white);\n  --bg-pressed:     #ECEBE5;\n  --bg-inset:       #ECEBE5;\n\n  --text-primary:   var(--fx-navy);\n  --text-secondary: var(--fx-ink);\n  --text-muted:     rgba(20,35,59,0.55);\n  --text-inverse:   var(--fx-light);\n  --text-accent:    var(--fx-teal);\n  --text-link:      var(--fx-blue);\n\n  --border-subtle:  var(--fx-divider-light);\n  --border-default: #D8D7D1;\n  --border-strong:  #B9B8B1;\n  --divider:        var(--fx-divider-light);\n\n  --grid-line:      var(--fx-divider-light);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   TYPOGRAPHY — \"The Voice\"\n   One typeface. One voice. (FluxionSystem Brand Book §04)\n   Scale is expressed for screen (px). Print/slide point sizes\n   from the brand book are noted inline for reference.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: \"Archivo\", \"Inter\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-sans:    \"Archivo\", \"Inter\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono:    \"IBM Plex Mono\", \"SFMono-Regular\", ui-monospace, Menlo, Consolas, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n  --fw-bold:    700;  /* @kind font */\n\n  /* ---- Type scale (px → rem @16) ----            brand token / pt */\n  --fs-display: 2.75rem;  /* 44px  · display   36pt */\n  --fs-h1:      2rem;     /* 32px  · heading-1 28pt */\n  --fs-h2:      1.5rem;   /* 24px  · heading-2 20pt */\n  --fs-h3:      1rem;     /* 16px  · heading-3 14pt */\n  --fs-body-lg: 1.125rem; /* 18px                   */\n  --fs-body:    1rem;     /* 16px  · body      12pt */\n  --fs-caption: 0.8125rem;/* 13px  · caption    9pt */\n  --fs-label:   0.75rem;  /* 12px  · label      8pt */\n\n  /* ---- Line heights ---- */\n  --lh-display: 1.1;   /* @kind font */\n  --lh-heading: 1.18;  /* @kind font */\n  --lh-snug:    1.3;   /* @kind font */\n  --lh-body:    1.6;   /* @kind font */\n  --lh-caption: 1.4;   /* @kind font */\n\n  /* ---- Tracking (letter-spacing) ---- */\n  --tk-display: -0.01em;   /* @kind font */\n  --tk-heading: -0.005em;  /* @kind font */\n  --tk-h3:       0.03em;   /* @kind font */\n  --tk-body:     0;        /* @kind font */\n  --tk-caption:  0.04em;   /* @kind font */\n  --tk-label:    0.16em;   /* @kind font */\n  --tk-wordmark: 0.32em;   /* @kind font */\n}\n\n/* ============================================================\n   TEXT ROLE CLASSES — optional helpers mirroring the scale.\n   Components reference the tokens directly; these are for\n   specimen cards, docs and quick layouts.\n   ============================================================ */\n.fx-display {\n  font-family: var(--font-display);\n  font-size: var(--fs-display);\n  line-height: var(--lh-display);\n  letter-spacing: var(--tk-display);\n  font-weight: var(--fw-semibold);\n}\n.fx-h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tk-heading);\n  font-weight: var(--fw-bold);\n}\n.fx-h2 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-bold);\n}\n.fx-h3 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-h3);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tk-h3);\n  font-weight: var(--fw-bold);\n}\n.fx-body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  font-weight: var(--fw-regular);\n}\n.fx-caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-caption);\n  line-height: var(--lh-caption);\n  letter-spacing: var(--tk-caption);\n  font-weight: var(--fw-regular);\n}\n.fx-label {\n  font-family: var(--font-sans);\n  font-size: var(--fs-label);\n  line-height: var(--lh-caption);\n  letter-spacing: var(--tk-label);\n  font-weight: var(--fw-bold);\n  text-transform: uppercase;\n}\n.fx-mono {\n  font-family: var(--font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   SPACING, RADII, BORDERS — Layout system\n   Built on a 4px grid. \"Precision margins, breathing room.\"\n   (FluxionSystem Brand Book §05)\n   ============================================================ */\n\n:root {\n  /* ---- 4px spacing scale ---- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* Precision page margin ≈ 0.35in. Content never bleeds to the edge. */\n  --space-edge: 34px;\n\n  /* ---- Corner radii (technical, restrained) ---- */\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   6px;\n  --radius-lg:   10px;\n  --radius-xl:   16px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Borders & rules ---- */\n  --border-width:   1px;\n  --border-width-2: 2px;     /* icon stroke weight */\n  --bar-width:      6px;     /* section accent bar, left edge ≈ 0.06\" */\n  --rule-thin:      1px;     /* dividers, grid lines */\n  --rule-accent:    2px;     /* data accent lines */\n\n  /* ---- Icon sizing (multiples of 4; in a 24–32px circle) ---- */\n  --icon-sm:  16px;\n  --icon-md:  20px;\n  --icon-lg:  24px;\n  --icon-chip-sm: 24px;\n  --icon-chip-md: 32px;\n\n  /* ---- Container widths ---- */\n  --container-sm:  640px;\n  --container-md:  960px;\n  --container-lg:  1200px;\n  --container-xl:  1440px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   ELEVATION & MOTION\n   Shadows are used sparingly and only on LIGHT surfaces.\n   On dark surfaces, depth comes from borders and the navy ramp,\n   never glow or drop shadows. (Brand Book: \"no drop shadows\".)\n   ============================================================ */\n\n:root {\n  /* ---- Shadows (light surfaces) ---- */\n  --shadow-none: none;\n  --shadow-sm:  0 1px 2px rgba(6,14,26,0.06),\n                0 1px 3px rgba(6,14,26,0.08);\n  --shadow-md:  0 2px 4px rgba(6,14,26,0.06),\n                0 8px 20px -6px rgba(6,14,26,0.12);\n  --shadow-lg:  0 4px 8px rgba(6,14,26,0.08),\n                0 24px 48px -12px rgba(6,14,26,0.18);\n\n  /* Focus halo (keyboard) */\n  --shadow-focus: 0 0 0 3px var(--fx-teal-soft);\n\n  /* ---- Motion ---- */\n  /* Calm, precise, engineered. Fades and short slides — never bounce. */\n  --ease-standard:  cubic-bezier(0.2, 0, 0, 1);  /* @kind other */\n  --ease-emphasis:  cubic-bezier(0.3, 0, 0, 1);  /* @kind other */\n  --ease-exit:      cubic-bezier(0.4, 0, 1, 1);  /* @kind other */\n\n  --dur-instant: 80ms;   /* @kind other */\n  --dur-fast:    140ms;  /* @kind other */\n  --dur-base:    220ms;  /* @kind other */\n  --dur-slow:    360ms;  /* @kind other */\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --dur-instant: 0ms;  /* @kind other */\n    --dur-fast: 0ms;  /* @kind other */\n    --dur-base: 0ms;  /* @kind other */\n    --dur-slow: 0ms;  /* @kind other */\n  }\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   FluxionSystem Design System — global entry point.\n   Consumers link THIS file only. It is a manifest of @imports;\n   never add rules here directly.\n   ============================================================ */\n\n/* ============================================================\n   FONTS — FluxionSystem\n   Brand typeface: \"Grandview Display\" (Klim Type Foundry, commercial).\n   Font files were NOT provided, so we substitute the closest free\n   match on Google Fonts: ARCHIVO — an engineering grotesque in the\n   DIN 1451 lineage that Grandview itself descends from.\n   Data / numeric / hardware labels use IBM Plex Mono.\n   ▶ Replace these @import lines with self-hosted @font-face rules\n     once the licensed Grandview Display files are available.\n   ============================================================ */\n\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"bff5d69a-276e-432a-9e49-61022293d302\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"ba1a2bfc-2ed3-4ee3-8a21-89ddeda14174\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\ nicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c4480ec0-b4d0-466a-9f40-e07a1ad41977\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"52dc5389-7aa6-4386-abad-eac07a95f344\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"f2ad0b7a-417e-40df-a6e9-d2503bfa0ef9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"61391a8f-9d42-478c-9bc7-c7860e492bfe\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4a91a462-5a0c-4475-9b04-4ae5d0160047\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"456dcd49-fad9-4c63-a35e-d46c9f64463f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0fe2f077-a19e-49a7-8520-6698fc10dea6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2a676833-37a4-4a76-83ca-5c7538cadcce\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"335f31e1-31f6-4a9b-9ab9-5d541772affb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   COLORS — \"The Spectrum\"\n   Seven carefully chosen colours. Each carries meaning.\n   None is decorative. (FluxionSystem Brand Book §03)\n   ============================================================ */\n\n:root {\n  /* ---- Base spectrum (immutable brand hexes) ---- */\n  --fx-surface: #060E1A;   /* Primary dark  — page / slide / hero bg     */\n  --fx-navy:    #0B1F3A;   /* Secondary dark — cards, headers, footers   */\n  --fx-blue:    #2E86C1;   /* Accent · Data — charts, hardware, links    */\n  --fx-teal:    #17A589;   /* Accent · Primary — CTAs, active, key data  */\n  --fx-purple:  #7F77DD;   /* Accent · Semantic — uncertainty bands      */\n  --fx-amber:   #E67E22;   /* Accent · Warning — alerts, anomalies       */\n  --fx-light:   #F5F4F0;   /* Light bg — page / slide / paper            */\n  --fx-white:   #FFFFFF;\n  --fx-ink:     #14233B;   /* Body text on light surfaces                */\n\n  /* ---- Interaction shades (derived) ---- */\n  --fx-teal-hover:  #138A72;\n  --fx-teal-active: #0F7460;\n  --fx-teal-soft:   rgba(23,165,137,0.14);\n  --fx-blue-hover:  #2872A6;\n  --fx-blue-soft:   rgba(46,134,193,0.14);\n  --fx-amber-soft:  rgba(230,126,34,0.16);\n  --fx-purple-soft: rgba(127,119,221,0.20); /* uncertainty / confidence fill */\n\n  /* ---- Surface ramp on dark ---- */\n  --fx-navy-1: #0B1F3A;\n  --fx-navy-2: #0E2747;   /* elevated card / hover on dark               */\n  --fx-navy-3: #123056;   /* pressed / selected on dark                  */\n\n  /* ---- Neutral lines on light ---- */\n  --fx-divider-light: #E8E8E4;\n  --fx-divider-dark:  rgba(245,244,240,0.12);\n\n  /* ============================================================\n     SEMANTIC ALIASES — default theme is DARK (the brand default:\n     Surface bg for covers, closers and data-heavy content).\n     ============================================================ */\n  --bg-page:        var(--fx-surface);\n  --bg-card:        var(--fx-navy-1);\n  --bg-elevated:    var(--fx-navy-2);\n  --bg-pressed:     var(--fx-navy-3);\n  --bg-inset:       #04090F;\n\n  --text-primary:   var(--fx-light);\n  --text-secondary: rgba(245,244,240,0.66);\n  --text-muted:     rgba(245,244,240,0.42);\n  --text-inverse:   var(--fx-navy);\n  --text-accent:    var(--fx-teal);\n  --text-link:      var(--fx-blue);\n\n  --border-subtle:  rgba(245,244,240,0.10);\n  --border-default: rgba(245,244,240,0.18);\n  --border-strong:  rgba(245,244,240,0.32);\n  --divider:        var(--fx-divider-dark);\n\n  --accent:         var(--fx-teal);\n  --accent-hover:   var(--fx-teal-hover);\n  --accent-active:  var(--fx-teal-active);\n  --accent-contrast:var(--fx-white);\n  --warning:        var(--fx-amber);\n  --uncertainty:    var(--fx-purple);\n\n  /* Data-viz series (per Brand Book §05 charts) */\n  --data-1: var(--fx-teal);    /* primary series   */\n  --data-2: var(--fx-blue);    /* secondary series */\n  --data-3: var(--fx-purple);  /* uncertainty      */\n  --data-4: var(--fx-amber);   /* threshold / alert */\n  --grid-line: var(--fx-divider-dark);\n\n  --focus-ring: var(--fx-teal);\n}\n\n/* ============================================================\n   LIGHT THEME — apply .theme-light (or [data-theme=\"light\"]).\n   Used for two-column, comparison, table and data-light layouts.\n   ============================================================ */\n.theme-light,\n[data-theme=\"light\"] {\n  --bg-page:        var(--fx-light);\n  --bg-card:        var(--fx-white);\n  --bg-elevated:    var(--fx-white);\n  --bg-pressed:     #ECEBE5;\n  --bg-inset:       #ECEBE5;\n\n  --text-primary:   var(--fx-navy);\n  --text-secondary: var(--fx-ink);\n  --text-muted:     rgba(20,35,59,0.55);\n  --text-inverse:   var(--fx-light);\n  --text-accent:    var(--fx-teal);\n  --text-link:      var(--fx-blue);\n\n  --border-subtle:  var(--fx-divider-light);\n  --border-default: #D8D7D1;\n  --border-strong:  #B9B8B1;\n  --divider:        var(--fx-divider-light);\n\n  --grid-line:      var(--fx-divider-light);\n}\n\n/* ============================================================\n   TYPOGRAPHY — \"The Voice\"\n   One typeface. One voice. (FluxionSystem Brand Book §04)\n   Scale is expressed for screen (px). Print/slide point sizes\n   from the brand book are noted inline for reference.\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: \"Archivo\", \"Inter\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-sans:    \"Archivo\", \"Inter\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono:    \"IBM Plex Mono\", \"SFMono-Regular\", ui-monospace, Menlo, Consolas, monospace;\n\n  /* ---- Weights ---- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n  --fw-bold:    700;  /* @kind font */\n\n  /* ---- Type scale (px → rem @16) ----            brand token / pt */\n  --fs-display: 2.75rem;  /* 44px  · display   36pt */\n  --fs-h1:      2rem;     /* 32px  · heading-1 28pt */\n  --fs-h2:      1.5rem;   /* 24px  · heading-2 20pt */\n  --fs-h3:      1rem;     /* 16px  · heading-3 14pt */\n  --fs-body-lg: 1.125rem; /* 18px                   */\n  --fs-body:    1rem;     /* 16px  · body      12pt */\n  --fs-caption: 0.8125rem;/* 13px  · caption    9pt */\n  --fs-label:   0.75rem;  /* 12px  · label      8pt */\n\n  /* ---- Line heights ---- */\n  --lh-display: 1.1;   /* @kind font */\n  --lh-heading: 1.18;  /* @kind font */\n  --lh-snug:    1.3;   /* @kind font */\n  --lh-body:    1.6;   /* @kind font */\n  --lh-caption: 1.4;   /* @kind font */\n\n  /* ---- Tracking (letter-spacing) ---- */\n  --tk-display: -0.01em;   /* @kind font */\n  --tk-heading: -0.005em;  /* @kind font */\n  --tk-h3:       0.03em;   /* @kind font */\n  --tk-body:     0;        /* @kind font */\n  --tk-caption:  0.04em;   /* @kind font */\n  --tk-label:    0.16em;   /* @kind font */\n  --tk-wordmark: 0.32em;   /* @kind font */\n}\n\n/* ============================================================\n   TEXT ROLE CLASSES — optional helpers mirroring the scale.\n   Components reference the tokens directly; these are for\n   specimen cards, docs and quick layouts.\n   ============================================================ */\n.fx-display {\n  font-family: var(--font-display);\n  font-size: var(--fs-display);\n  line-height: var(--lh-display);\n  letter-spacing: var(--tk-display);\n  font-weight: var(--fw-semibold);\n}\n.fx-h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--tk-heading);\n  font-weight: var(--fw-bold);\n}\n.fx-h2 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-snug);\n  font-weight: var(--fw-bold);\n}\n.fx-h3 {\n  font-family: var(--font-sans);\n  font-size: var(--fs-h3);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tk-h3);\n  font-weight: var(--fw-bold);\n}\n.fx-body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  font-weight: var(--fw-regular);\n}\n.fx-caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-caption);\n  line-height: var(--lh-caption);\n  letter-spacing: var(--tk-caption);\n  font-weight: var(--fw-regular);\n}\n.fx-label {\n  font-family: var(--font-sans);\n  font-size: var(--fs-label);\n  line-height: var(--lh-caption);\n  letter-spacing: var(--tk-label);\n  font-weight: var(--fw-bold);\n  text-transform: uppercase;\n}\n.fx-mono {\n  font-family: var(--font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: 0;\n}\n\n/* ============================================================\n   SPACING, RADII, BORDERS — Layout system\n   Built on a 4px grid. \"Precision margins, breathing room.\"\n   (FluxionSystem Brand Book §05)\n   ============================================================ */\n\n:root {\n  /* ---- 4px spacing scale ---- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* Precision page margin ≈ 0.35in. Content never bleeds to the edge. */\n  --space-edge: 34px;\n\n  /* ---- Corner radii (technical, restrained) ---- */\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   6px;\n  --radius-lg:   10px;\n  --radius-xl:   16px;\n  --radius-pill: 999px;\n  --radius-circle: 50%;\n\n  /* ---- Borders & rules ---- */\n  --border-width:   1px;\n  --border-width-2: 2px;     /* icon stroke weight */\n  --bar-width:      6px;     /* section accent bar, left edge ≈ 0.06\" */\n  --rule-thin:      1px;     /* dividers, grid lines */\n  --rule-accent:    2px;     /* data accent lines */\n\n  /* ---- Icon sizing (multiples of 4; in a 24–32px circle) ---- */\n  --icon-sm:  16px;\n  --icon-md:  20px;\n  --icon-lg:  24px;\n  --icon-chip-sm: 24px;\n  --icon-chip-md: 32px;\n\n  /* ---- Container widths ---- */\n  --container-sm:  640px;\n  --container-md:  960px;\n  --container-lg:  1200px;\n  --container-xl:  1440px;\n}\n\n/* ============================================================\n   ELEVATION & MOTION\n   Shadows are used sparingly and only on LIGHT surfaces.\n   On dark surfaces, depth comes from borders and the navy ramp,\n   never glow or drop shadows. (Brand Book: \"no drop shadows\".)\n   ============================================================ */\n\n:root {\n  /* ---- Shadows (light surfaces) ---- */\n  --shadow-none: none;\n  --shadow-sm:  0 1px 2px rgba(6,14,26,0.06),\n                0 1px 3px rgba(6,14,26,0.08);\n  --shadow-md:  0 2px 4px rgba(6,14,26,0.06),\n                0 8px 20px -6px rgba(6,14,26,0.12);\n  --shadow-lg:  0 4px 8px rgba(6,14,26,0.08),\n                0 24px 48px -12px rgba(6,14,26,0.18);\n\n  /* Focus halo (keyboard) */\n  --shadow-focus: 0 0 0 3px var(--fx-teal-soft);\n\n  /* ---- Motion ---- */\n  /* Calm, precise, engineered. Fades and short slides — never bounce. */\n  --ease-standard:  cubic-bezier(0.2, 0, 0, 1);  /* @kind other */\n  --ease-emphasis:  cubic-bezier(0.3, 0, 0, 1);  /* @kind other */\n  --ease-exit:      cubic-bezier(0.4, 0, 1, 1);  /* @kind other */\n\n  --dur-instant: 80ms;   /* @kind other */\n  --dur-fast:    140ms;  /* @kind other */\n  --dur-base:    220ms;  /* @kind other */\n  --dur-slow:    360ms;  /* @kind other */\n}\n\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --dur-instant: 0ms;  /* @kind other */\n    --dur-fast: 0ms;  /* @ ltato: setup lunghi, scarti al primo pezzo e una conoscenza che vive nella testa di una persona sola.',\n    probStat: 'officine di lamiera nella nostra ricerca rifacevano a mano i preset del costruttore.',\n    solEyebrow: 'Cosa fa FluxionSystem', solH2: 'Parametri generati e verificati dalla fisica, non solo dallo storico.',\n    solBody: 'DenkWare genera e verifica i parametri di processo partendo dalla fisica del taglio e della piega. Lavora come livello consultivo accanto al controllo numerico esistente: le tue macchine restano le tue macchine, il CNC certificato resta al comando, e i parametri arrivano già verificati.',\n    values: [\n      { n: '01', title: 'Macchine esistenti, non nuove', body: 'Funziona sul taglio laser oggi, piegatura in arrivo. Senza sostituire la macchina e senza un progetto di retrofit.' },\n      { n: '02', title: 'Parametri dalla fisica, non dal tentativo', body: 'Meno ricalibrazioni manuali, meno scarti al primo taglio, setup più corti.' },\n      { n: '03', title: 'La conoscenza esce dalla testa dell’operatore', body: 'Un nuovo operatore parte con parametri verificati, non con la tabella del fornitore.' },\n      { n: '04', title: 'Trasferibile tra macchine', body: 'Un modello addestrato su una macchina non funziona su un’altra: lo abbiamo misurato. L’approccio fisico è pensato per trasferirsi.' },\n    ],\n    demoEyebrow: 'Cosa succede in 20 minuti', demoH2: 'Nessuna presentazione aziendale. Un caso reale, il tuo.',\n    demoNote: 'Se porti un disegno o una foto del difetto, meglio. Parli con Michele Fornasiero, Country Director Italia, o con un fondatore. Italiano o inglese.',\n    steps: [\n      { time: '00–05′', title: 'Ci racconti il problema', body: 'Una macchina o un processo che ti dà problemi: materiale, spessore, difetto ricorrente.' },\n      { time: '05–15′', title: 'Vedi DenkWare al lavoro', body: 'Genera e verifica i parametri su dati reali di taglio, con i limiti di confidenza espliciti.' },\n      { time: '15–20′', title: 'Capisci se ha senso un pilota', body: 'Cosa serve, cosa non serve, tempi. Una risposta onesta, anche se è no.' },\n    ],\n    proofEyebrow: 'Prove', proofH2: 'Dati misurati e ricerca sul campo, non promesse.',\n    proof: [\n      { fig: '1.096', cap: 'Tagli misurati', body: 'Su due macchine nella nostra base di validazione.' },\n      { fig: '15', cap: 'Produttori', body: 'Ricerca sul campo con produttori di lamiera e macchinari, 17 interviste.' },\n      { fig: 'DenkFree', cap: 'Prodotto live', body: 'Una versione gratuita è già disponibile: puoi provarla prima della fiera.' },\n    ],\n    whereEyebrow: 'Dove trovarci', datesLong: '13–16 ottobre 2026 · 9:30–18:00', metro: 'Metro M1 Rho Fiera, ingresso Porta Est', mapLink: 'Apri in Google Maps',\n    entryEyebrow: 'Ingresso', entryH: 'Gratuito, con registrazione online.', entryBody: 'Il pass BI-MU si ottiene sul sito ufficiale ed è valido per tutti e quattro i giorni. Se hai un codice invito FluxionSystem, inseriscilo in fase di registrazione.', codeLbl: 'Codice invito', passLink: 'Registrati su bimu.it',\n    bookEyebrow: 'Prenota', bookH2: 'Scegli giorno e ora. Ci vediamo a D32.',\n    bookBody: 'Ricevi la conferma via email con il punto d’incontro allo stand. Se cambi programma, sposta l’appuntamento dal link nella conferma.',\n    askLbl: 'Ti chiederemo', asks: ['Azienda', 'Ruolo', 'Macchina o processo da discutere'],\n    micro: 'Slot 13–16 ottobre, 10:00–17:30. Posti limitati per giorno.',\n    eventName: 'BI-MU: 20 minuti a D32', phBadge: 'Anteprima', confirm: 'Conferma slot',\n    pickSlot: 'Seleziona un orario', dows: ['Mar', 'Mer', 'Gio', 'Ven'],\n    thanksEyebrow: 'Prenotazione confermata', thanksH: 'Grazie: ci vediamo a D32.',\n    thanksBody: 'Ti abbiamo inviato la conferma. Porta il tuo caso: un disegno, una foto del difetto, o semplicemente il problema.',\n    disclaimer: 'Espositore a BI-MU. Non affiliato con gli organizzatori.',\n  },\n  en: {\n    headerEvent: '35.BI-MU · 13–16 Oct 2026', headerStand: 'Hall 22 · Stand D32',\n    cta: 'Book 20 minutes at BI-MU', ctaSecondary: 'What you will see', stickyCta: 'Book 20 minutes',\n    heroEyebrow: 'FluxionSystem · Exhibitor at 35.BI-MU',\n    heroH1a: 'Bring one hard machine to BI-MU.',\n    heroH1b: 'In 20 minutes, see how physics-based AI makes it smarter.',\n    heroSub: 'Laser cutting and bending: bring one real problem with parameters, scrap or set-up. Book a 20-minute slot at Stand D32 and pick a day and time below.',\n    cardEyebrow: 'Find us at', cardHall: 'Hall 22', lblDates: 'Dates', dates: '13–16 Oct', lblHours: 'Hours', lblSlot: 'Meeting', lblEntry: 'Entry', entryFree: 'Free',\n    probEyebrow: 'The problem', probH2: 'The vendor’s presets are not your parameters.',\n    probBody: 'Every material, gauge and machine behaves differently, and recalibration lands on your most experienced operator. The result: long set-ups, first-part scrap, and know-how that lives in one person’s head.',\n    probStat: 'sheet-metal shops in our research were re-doing the builder’s presets by hand.',\n    solEyebrow: 'What FluxionSystem does', solH2: 'Parameters generated and verified by physics, not just by history.',\n    solBody: 'DenkWare generates and verifies process parameters from the physics of cutting and bending. It runs as an advisory layer next to your existing CNC: your machines stay your machines, the certified controller stays in charge, and parameters arrive verified.',\n    values: [\n      { n: '01', title: 'Existing machines, not new ones', body: 'Works on laser cutting today, bending next. No machine replacement and no retrofit project.' },\n      { n: '02', title: 'Parameters from physics, not trial and error', body: 'Fewer manual recalibrations, less first-cut scrap, shorter set-ups.' },\n      { n: '03', title: 'Know-how leaves the operator’s head', body: 'A new operator starts from verified parameters, not the vendor table.' },\n      { n: '04', title: 'Transferable across machines', body: 'A model trained on one machine does not work on another — we measured it. The physics approach is built to transfer.' },\n    ],\n    demoEyebrow: 'What happens in 20 minutes', demoH2: 'No company presentation. One real case — yours.',\n    demoNote: 'Bring a drawing or a photo of the defect if you can. You will meet a founder or Michele Fornasiero, Country Director Italy. English or Italian.',\n    steps: [\n      { time: '00–05′', title: 'You describe the problem', body: 'One machine or process that gives you trouble: material, gauge, recurring defect.' },\n      { time: '05–15′', title: 'You watch DenkWare work', body: 'It generates and verifies parameters on real cutting data, with explicit confidence bounds.' },\n      { time: '15–20′', title: 'You know whether a pilot makes sense', body: 'What is needed, what is not, and how long. An honest answer, even if it is no.' },\n    ],\n    proofEyebrow: 'Proof', proofH2: 'Measured data and field research, not promises.',\n    proof: [\n      { fig: '1,096', cap: 'Measured cuts', body: 'Across two machines in our validation base.' },\n      { fig: '15', cap: 'Manufacturers', body: 'Field research with sheet-metal and machinery manufacturers, 17 interviews.' },\n      { fig: 'DenkFree', cap: 'Live product', body: 'A free tier is already available — try it before the show.' },\n    ],\n    whereEyebrow: 'Where to find us', datesLong: '13–16 October 2026 · 9:30–18:00', metro: 'Metro M1 Rho Fiera, Porta Est entrance', mapLink: 'Open in Google Maps',\n    entryEyebrow: 'Entry', entryH: 'Free, with online registration.', entryBody: 'The BI-MU pass is issued on the official site and is valid for all four days. If you have a FluxionSystem invitation code, enter it at registration.', codeLbl: 'Invitation code', passLink: 'Register at bimu.it',\n    bookEyebrow: 'Book', bookH2: 'Pick a day and time. See you at D32.',\n    bookBody: 'You get an email confirmation with the meeting point at the stand. Reschedule from the link in the confirmation.',\n    askLbl: 'We will ask for', asks: ['Company', 'Role', 'Machine or process to discuss'],\n    micro: 'Slots 13–16 October, 10:00–17:30. Limited places per day.',\n    eventName: 'BI-MU: 20 minutes at D32', phBadge: 'Preview', confirm: 'Confirm slot',\n    pickSlot: 'Select a time', dows: ['Tue', 'Wed', 'Thu', 'Fri'],\n    thanksEyebrow: 'Booking confirmed', thanksH: 'Thank you — see you at D32.',\n    thanksBody: 'We have sent your confirmation. Bring your case: a drawing, a photo of the defect, or simply the problem.',\n    disclaimer: 'Exhibitor at BI-MU. Not affiliated with the organisers.',\n  },\n};\n\nconst SLOTS = [];\nfor (let m = 600; m <= 1050; m += 30) SLOTS.push(`${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`);\n\nclass Component extends DCLogic {\n  state = { lang: null, mobile: false, pastHero: false, day: 0, slot: null, booked: false };\n\n  componentDidMount() {\n    const q = new URLSearchParams(location.search);\n    const urlLang = q.get('lang') || (/bimu-en/.test(location.pathname) ? 'en' : null);\n    if (urlLang === 'en' || urlLang === 'it') this.setState({ lang: urlLang });\n    this.onResize = () => this.setState({ mobile: window.innerWidth < 760 });\n    this.onScroll = () => this.setState({ pastHero: window.scrollY > 420 });\n    this.onMsg = (e) => {\n      const ev = e.data && e.data.event;\n      if (typeof ev !== 'string' || ev.indexOf('calendly.') !== 0) return;\n      window.dataLayer = window.dataLayer || [];\n      if (ev === 'calendly.event_type_viewed') window.dataLayer.push({ event: 'bimu_widget_opened' });\n      if (ev === 'calendly.event_scheduled') { window.dataLayer.push({ event: 'bimu_meeting_booked' }); this.setState({ booked: true }); }\n    };\n    this.onResize(); this.onScroll();\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('message', this.onMsg);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('message', this.onMsg);\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' });\n    window.dataLayer = window.dataLayer || [];\n    if (id === 'prenota') window.dataLayer.push({ event: 'bimu_cta_click' });\n  }\n\n  renderVals() {\n    const lang = this.state.lang || this.props.lang || 'it';\n    const t = COPY[lang];\n    const { mobile, pastHero, day, slot, booked } = this.state;\n    const url = (this.props.calendlyUrl || '').trim();\n    const langBtn = (on) => ({ padding: '6px 10px', border: 0, cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: 12, letterSpacing: '0.1em', background: on ? 'var(--fx-teal)' : 'transparent', color: on ? '#FFFFFF' : 'var(--text-secondary)' });\n\n    let calendlySrc = '';\n    if (url) {\n      const q = new URLSearchParams(location.search);\n      const p = new URLSearchParams({ embed_domain: location.hostname || 'fluxionsystem.com', embed_type: 'Inline', hide_gdpr_banner: '1', primary_color: '17a589' });\n      ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'].forEach(k => q.get(k) && p.set(k, q.get(k)));\n      if (q.get('gclid')) p.set('salesforce_uuid', q.get('gclid'));\n      calendlySrc = url + (url.includes('?') ? '&' : '?') + p.toString();\n    }\n\n    const days = [13, 14, 15, 16].map((num, i) => ({\n      num, dow: t.dows[i],\n      pick: () => this.setState({ day: i, slot: null }),\n      style: { padding: '12px 8px', borderRadius: 6, cursor: 'pointer', textAlign: 'center', fontFamily: 'var(--font-sans)', border: '1px solid ' + (day === i ? 'var(--fx-teal)' : 'var(--fx-divider-light)'), background: day === i ? 'var(--fx-teal)' : '#FFFFFF', color: day === i ? '#FFFFFF' : 'var(--fx-navy)' },\n    }));\n    const taken = new Set([(day * 3 + 1) % 16, (day * 5 + 4) % 16, (day * 7 + 9) % 16]);\n    const slots = SLOTS.map((label, i) => {\n      const off = taken.has(i), on = slot === i;\n      return {\n        label,\n        pick: () => !off && this.setState({ slot: i }),\n        style: { height: 40, borderRadius: 6, fontFamily: 'var(--font-mono)', fontSize: 14, cursor: off ? 'not-allowed' : 'pointer', textDecoration: off ? 'line-through' : 'none', border: '1px solid ' + (on ? 'var(--fx-teal)' : 'var(--fx-divider-light)'), background: on ? 'var(--fx-teal-soft)' : (off ? '#ECEBE5' : '#FFFFFF'), color: off ? 'rgba(20,35,59,0.35)' : 'var(--fx-navy)', fontWeight: on ? 600 : 400 },\n      };\n    });\n\n    return {\n      t,\n      setIt: () => this.setState({ lang: 'it' }),\n      setEn: () => this.setState({ lang: 'en' }),\n      itBtnStyle: langBtn(lang === 'it'), enBtnStyle: langBtn(lang === 'en'),\n      showHeaderCta: !mobile,\n      goBook: () => this.scrollTo('prenota'),\n      goDemo: () => this.scrollTo('demo'),\n      hasInviteCode: !!(this.props.inviteCode || '').trim(),\n      inviteCode: this.props.inviteCode,\n      booked,\n      showEmbed: !booked && !!url,\n      showPlaceholder: !booked && !url,\n      calendlySrc,\n      days, slots,\n      noSlot: slot === null,\n      selectionLabel: slot === null ? t.pickSlot : `${t.dows[day]} ${13 + day} · ${SLOTS[slot]}`,\n      confirmDemo: () => this.setState({ booked: true }),\n      showSticky: mobile && pastHero && !booked,\n      footerPadBottom: mobile ? '96px' : '28px',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
